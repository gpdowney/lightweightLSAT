site_name: the lightweight LSAT
site_url: https://lightweightlsat.com

theme:
  name: material
  font: 
    text: 'B612'
  icon:
    logo: material/hiking
    repo: fontawesome/brands/git-alt
  palette:
      scheme: default
      primary: white
      accent: teal
  features:
    - toc.follow
    - navigation.top
    - navigation.indexes
    - navigation.tabs
    - navigation.footer
    - navigation.expand

plugins:
  - search
  - literate-nav:
      nav_file: navigation.md

markdown_extensions:
  - abbr
  - attr_list
  - admonition
  - toc:
      title: on this page
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      auto_append:
        - includes/glossary.md
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.smartsymbols:
      trademark: true
      copyright: false
      registered: true
      care_of: true
      plusminus: true
      arrows: true
      notequal: true
      fractions: true
      ordinal_numbers: true
  - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: >
  All original material licensed <a href="https://creativecommons.org/licenses/by-sa/4.0/" rel="license">CC BY-SA 4.0.</a><br>
  The LSAC does not approve of this website. And I do not approve of the LSAC.

site_description: A minimalist guide to the LSAT.